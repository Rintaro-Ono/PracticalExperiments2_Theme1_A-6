<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聖徳太子会計</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1>聖徳太子会計</h1>
      </header>

      <!-- ログイン画面 -->
      <section class="login-panel" aria-labelledby="login-title">
        <h2 id="login-title">ユーザー情報</h2>

        <form id="login-form">
          <div class="form-group">
            <label for="user-id">ユーザーID</label>
            <input type="text" id="user-id" name="user-id" placeholder="例: s001" required />
          </div>

          <div class="form-group">
            <label for="user-name">名前</label>
            <input type="text" id="user-name" name="user-name" placeholder="例: 田中 太郎" required />
          </div>

          <div class="form-actions">
            <button type="submit">ログイン</button>
          </div>
        </form>
      </section>

      <!-- イベント一覧 -->
      <section class="event-panel" aria-labelledby="event-list-title" hidden>
        <div class="panel-header">
          <h2 id="event-list-title">イベント一覧</h2>
          <button type="button" class="add-event-button">イベントを追加</button>
        </div>

        <ul id="event-list" aria-live="polite">
          <!-- JS でイベント項目を描画 -->
        </ul>
      </section>

      <!-- イベント詳細 -->
      <section class="event-detail-panel" aria-labelledby="event-detail-title" hidden>
        <h2 id="event-detail-title">イベント詳細</h2>

        <dl class="event-detail-list">
          <div>
            <dt>イベント名</dt>
            <dd id="detail-event-name">-</dd>
          </div>
          <div>
            <dt>金額</dt>
            <dd id="detail-event-amount">-</dd>
          </div>
          <div>
            <dt>日付</dt>
            <dd id="detail-event-date">-</dd>
          </div>
        </dl>

        <h3>参加者</h3>
        <ul id="detail-participant-list">
          <!-- JS で参加者を描画 -->
        </ul>

        <div class="action-buttons">
          <button type="button" class="edit-event-button">編集</button>
          <button type="button" class="delete-event-button">削除</button>
        </div>
      </section>

      <!-- 参加者一覧 -->
      <section class="participant-panel" aria-labelledby="participant-title" hidden>
        <h2 id="participant-title">参加者一覧</h2>

        <table id="participant-table">
          <thead>
            <tr>
              <th scope="col">名前</th>
              <th scope="col">状態</th>
            </tr>
          </thead>
          <tbody id="participant-table-body">
            <!-- JS で参加者の状態を描画 -->
          </tbody>
        </table>
      </section>
    </main>

    <!-- イベント追加モーダル -->
    <div class="modal" id="add-event-modal" aria-hidden="true" hidden>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="add-event-title">
        <button type="button" class="modal-close" aria-label="閉じる">×</button>
        <h2 id="add-event-title">イベントを追加</h2>

        <form id="add-event-form">
          <div class="form-group">
            <label for="event-name">イベント名</label>
            <input type="text" id="event-name" name="event-name" required />
          </div>

          <div class="form-group">
            <label for="event-amount">金額</label>
            <input type="number" id="event-amount" name="event-amount" min="0" required />
          </div>

          <div class="form-group">
            <label for="event-date">日付</label>
            <input type="date" id="event-date" name="event-date" required />
          </div>

          <fieldset class="participant-select-field">
            <legend>参加者を選択</legend>
            <ul id="participant-checkbox-list">
              <!-- JS でチェックボックスを描画 -->
            </ul>
          </fieldset>

          <div class="form-actions">
            <button type="submit">追加</button>
            <button type="button" class="modal-cancel">キャンセル</button>
          </div>
        </form>
      </div>
    </div>

    <!-- イベント編集モーダル -->
    <div class="modal" id="edit-event-modal" aria-hidden="true" hidden>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="edit-event-title">
        <button type="button" class="modal-close" aria-label="閉じる">×</button>
        <h2 id="edit-event-title">イベントを編集</h2>

        <form id="edit-event-form">
          <div class="form-group">
            <label for="edit-event-name">イベント名</label>
            <input type="text" id="edit-event-name" name="edit-event-name" required />
          </div>

          <div class="form-group">
            <label for="edit-event-amount">金額</label>
            <input type="number" id="edit-event-amount" name="edit-event-amount" min="0" required />
          </div>

          <div class="form-group">
            <label for="edit-event-date">日付</label>
            <input type="date" id="edit-event-date" name="edit-event-date" required />
          </div>

          <div class="form-actions">
            <button type="submit">保存</button>
            <button type="button" class="modal-cancel">キャンセル</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 削除確認モーダル -->
    <div class="modal" id="delete-event-modal" aria-hidden="true" hidden>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="delete-event-title">
        <button type="button" class="modal-close" aria-label="閉じる">×</button>
        <h2 id="delete-event-title">イベントを削除</h2>
        <p>本当にこのイベントを削除しますか？</p>

        <div class="form-actions">
          <button type="button" class="confirm-delete-button">削除</button>
          <button type="button" class="modal-cancel">キャンセル</button>
        </div>
      </div>
    </div>

    <!-- 参加者状態変更モーダル -->
    <div class="modal" id="status-modal" aria-hidden="true" hidden>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="status-title">
        <button type="button" class="modal-close" aria-label="閉じる">×</button>
        <h2 id="status-title">参加者の状態を変更</h2>

        <form id="status-form">
          <div class="form-group">
            <label for="status-select">状態</label>
            <select id="status-select" name="status-select" required>
              <option value="未入金">未入金</option>
              <option value="承認待ち">承認待ち</option>
              <option value="承認済み">承認済み</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit">変更</button>
            <button type="button" class="modal-cancel">キャンセル</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
